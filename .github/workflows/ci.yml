name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: "Build ui-kit (file: dependency)"
        # ui-kit is a public sibling repo consumed via file:../sentry-ui-kit.
        # Clone + build the REAL package so its named exports + types resolve
        # for typecheck and the Next build (the old stub had no exports, so
        # every ui-kit import failed typecheck).
        run: |
          git clone --depth 1 --branch main \
            https://github.com/Chipmo-Sentry/sentry-ui-kit.git ../sentry-ui-kit
          (cd ../sentry-ui-kit && npm ci --no-audit --no-fund && npm run build)

      - name: Install (npm ci)
        run: npm ci --no-audit --no-fund

      - name: OpenAPI types in sync
        run: npm run codegen:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build (Next.js standalone)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
